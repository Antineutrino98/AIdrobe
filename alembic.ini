[alembic]
script_location = alembic
prepend_sys_path = .
# The real URL is read from the DATABASE_URL env var by alembic/env.py.
# This value is only a placeholder and is never used.
# NOTE: keep this file ASCII-only. Alembic reads .ini with the Windows locale
# encoding (GBK on Chinese Windows); UTF-8 Chinese comments break the parser.
sqlalchemy.url = postgresql+asyncpg://placeholder:placeholder@localhost:5432/placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
